<html lang="en">

<head>

</head>

<body>
    <button id="notfiy">уведомление</button>
    <script>
        const btn = document.getElementById('notfiy')
        btn.onclick = async () => {
            const permission = await Notification.requestPermission()
            if (permission === 'granted') {
                const n = new Notification('Title', {
                    body: 'Test',
                    icon: './image.png',
                    silent: false
                })
                n.onclick = () => console.log('asdasd')
                n.on
            }
        }
    </script>
</body>
